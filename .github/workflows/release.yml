name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the release to (e.g. v1.0.108). Leave empty to only build and upload artifacts.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-deps

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ matrix.os }}
          max-size: 2G

      - uses: ./.github/actions/build-node

      - uses: ./.github/actions/run-tests

      - name: Stage binary and checksum
        shell: bash
        run: |
          mkdir -p dist
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          cp build/minima "dist/minima-${os}-${arch}"
          shasum -a 256 "dist/minima-${os}-${arch}" > "dist/minima-${os}-${arch}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: minima-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    # Repo default token is read-only; publishing the release needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        shell: bash
        run: |
          # Auto-generated per-version changelog (GitHub API), prepended with
          # the static usage docs so every release ships the same run guide.
          payload=$(jq -n --arg tag "${{ steps.release.outputs.tag }}" '{ tag_name: $tag }')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -d "$payload" | jq -r '.body' > generated_notes.md
          cat .github/RELEASE_NOTES_USAGE.md generated_notes.md > combined_notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: combined_notes.md
          files: artifacts/*
