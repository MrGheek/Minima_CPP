name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the release to (e.g. v1.0.108). Leave empty to only build and upload artifacts.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-deps

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ matrix.os }}
          max-size: 2G

      - uses: ./.github/actions/build-node

      - uses: ./.github/actions/run-tests

      - name: Stage binary and checksum
        shell: bash
        run: |
          mkdir -p dist
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          cp build/minima "dist/minima-${os}-${arch}"
          shasum -a 256 "dist/minima-${os}-${arch}" > "dist/minima-${os}-${arch}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: minima-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    # Repo default token is read-only; publishing the release needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*

      - name: Prepend usage guide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # softprops server-generates the per-version changelog; reuse it and
          # prepend the static usage docs so every release ships the same guide.
          body=$(gh release view "${{ steps.release.outputs.tag }}" --json body --jq '.body')
          {
            cat .github/RELEASE_NOTES_USAGE.md
            printf '\n---\n\n'
            printf '%s\n' "$body"
          } > combined.md
          gh release edit "${{ steps.release.outputs.tag }}" --notes-file combined.md
