name: CI
on: [push, pull_request]

# Cancel superseded runs on the same ref to avoid wasting minutes on
# outdated commits (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-deps

      # ccache: stable key + timestamped saves => cache is shared across all
      # branches and PRs, so only changed files are recompiled on each run.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ matrix.os }}
          max-size: 2G

      - uses: ./.github/actions/build-node

      - uses: ./.github/actions/run-tests
