name: Install dependencies
description: Install build dependencies for the Minima C++ node

runs:
  using: composite
  steps:
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          libssl-dev \
          zlib1g-dev \
          libcurl4-openssl-dev \
          libboost-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install --quiet sqlite3 openssl zlib curl boost
